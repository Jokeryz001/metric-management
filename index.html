<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标管理功能 - Demo 导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .demo-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .demo-card {
            display: flex;
            align-items: center;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
        }
        .demo-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }
        .demo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .demo-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }
        .demo-info {
            flex: 1;
        }
        .demo-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .demo-desc {
            font-size: 14px;
            color: #888;
        }
        .arrow {
            color: #667eea;
            font-size: 24px;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>指标管理功能</h1>
        <p class="subtitle">产品交互 Demo 演示</p>

        <div class="demo-list">
            <a href="metric-index.html" class="demo-card">
                <div class="demo-icon">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                </div>
                <div class="demo-info">
                    <div class="demo-title">评价指标管理</div>
                    <div class="demo-desc">指标列表展示、搜索、编辑功能</div>
                </div>
                <div class="arrow">→</div>
            </a>

            <a href="fix-records.html" class="demo-card">
                <div class="demo-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                </div>
                <div class="demo-info">
                    <div class="demo-title">问题上报与修复记录</div>
                    <div class="demo-desc">问题提报、状态跟踪、修复记录</div>
                </div>
                <div class="arrow">→</div>
            </a>
        </div>

        <div class="footer">
            <p>源代码: <a href="https://github.com/Jokeryz001/metric-management" target="_blank">github.com/Jokeryz001/metric-management</a></p>
        </div>
    </div>
</body>
</html>
